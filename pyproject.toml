[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "river"
version = "0.1.0"
description = "GPU-first Heads-Up No-Limit Hold'em environment (NVIDIA Warp) and RL training stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Christian Engel" }]
keywords = [
    "poker",
    "holdem",
    "reinforcement-learning",
    "nvidia-warp",
    "cuda",
    "pytorch",
    "game-theory",
    "rl-environment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "warp-lang>=1.10.1",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "hydra-core>=1.3.2",
    "tqdm>=4.67.1",
    "tensorboard>=2.20.0",
    "nvidia-ml-py>=13.590.48",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
torchrl = ["torchrl>=0.10.1"]
tracking = ["mlflow>=3.5.1"]
onnx = [
    "onnx>=1.21.0",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.7.0",
]
all = [
    "torchrl>=0.10.1",
    "mlflow>=3.5.1",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/protortyp/river"
Repository = "https://github.com/protortyp/river"
Issues = "https://github.com/protortyp/river/issues"

[dependency-groups]
dev = [
    "line-profiler>=5.0.0",
    "memory-profiler>=0.61.0",
    "mlflow>=3.5.1",
    "nvtx>=0.2.14",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.7.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.2",
    "ruff>=0.14.8",
    "scalene>=2.1.0",
    "torchrl>=0.10.1",
    "treys>=0.1.8",
    "ty>=0.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"bench/profile_training.py" = ["SIM117"]
"play/interactive.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --assert=plain"

[tool.coverage.run]
source = ["src/gpu_poker", "src/river"]
omit = ["*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
