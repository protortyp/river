# ty 0.0.2 does not understand Warp kernel annotation forms such as
# `wp.array(dtype=...)`, Warp scalar operator overloads, TorchRL TensorDict
# indexing, or torch.compile's return type. Keep ty wired into the quality gate,
# but suppress the current false-positive rule families until the checker and/or
# local stubs can model those APIs.

[rules]
invalid-type-form = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
invalid-assignment = "ignore"
non-subscriptable = "ignore"
invalid-parameter-default = "ignore"
invalid-method-override = "ignore"
