name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint & format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run ty check
      - name: Test (CPU)
        run: uv run pytest -m "not cuda"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies for fixture generation
        run: uv sync --group dev
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web parity & ONNX inference
        working-directory: web
        run: npm test
      - name: Build static web bundle
        working-directory: web
        run: npm run build
